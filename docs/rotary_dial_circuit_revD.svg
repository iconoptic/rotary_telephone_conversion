<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1040" font-family="monospace" font-size="14">
  <style>
    .wire   { stroke:#111; stroke-width:2; fill:none; }
    .dash   { stroke:#666; stroke-width:1.5; fill:none; stroke-dasharray:5,4; }
    .lbl    { fill:#111; font-size:13px; }
    .lbl-b  { fill:#111; font-size:13px; font-weight:bold; }
    .lbl-sm { fill:#333; font-size:11px; }
    .ic     { fill:#f5f0e6; stroke:#111; stroke-width:2; }
    .node   { fill:#111; }
    .res    { fill:#fff; stroke:#111; stroke-width:2; }
  </style>

  <text x="20" y="28" class="lbl-b" font-size="19">Rotary Phone &#8594; Pico (RP2040) &#8212; Rev D (adds switchhook / lever, 2026-07-26)</text>
  <text x="20" y="48" class="lbl-sm">Dial fully isolated from phone network. WHITE = shunt/off-normal (14.5k&#8486; bleeder), BLUE = pulse (true dry contact), GREEN/WHITE = switchhook lever (true dry contact).</text>

  <!-- ======================= PICO BODY ======================= -->
  <rect x="700" y="150" width="240" height="590" rx="6" class="ic"/>
  <text x="820" y="140" text-anchor="middle" class="lbl-b">Raspberry Pi Pico (RP2040)</text>

  <!-- Pin stubs, left edge -->
  <circle cx="700" cy="180" r="3" class="node"/>
  <text x="710" y="176" class="lbl-sm">3V3(OUT)  phys 36</text>
  <circle cx="700" cy="260" r="3" class="node"/>
  <text x="710" y="256" class="lbl-sm">GP2  phys 4  (SHUNT_IN)</text>
  <circle cx="700" cy="340" r="3" class="node"/>
  <text x="710" y="336" class="lbl-sm">GP3  phys 5  (PULSE_IN)</text>
  <circle cx="700" cy="420" r="3" class="node"/>
  <text x="710" y="416" class="lbl-sm">GP4  phys 6  (HOOK_IN)</text>
  <circle cx="700" cy="700" r="3" class="node"/>
  <text x="710" y="696" class="lbl-sm">GND  phys 38</text>

  <!-- Pin stubs, right edge -->
  <circle cx="940" cy="430" r="3" class="node"/>
  <text x="930" y="426" text-anchor="end" class="lbl-sm">GP14  phys 19</text>
  <circle cx="940" cy="500" r="3" class="node"/>
  <text x="930" y="496" text-anchor="end" class="lbl-sm">GP15  phys 20</text>

  <!-- Internal pull-up on GP3 (dashed, inside Pico) -->
  <line x1="700" y1="340" x2="760" y2="340" class="dash"/>
  <line x1="760" y1="340" x2="760" y2="310" class="dash"/>
  <rect x="752" y="260" width="16" height="50" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="760" y1="260" x2="760" y2="235" class="dash"/>
  <text x="772" y="290" class="lbl-sm" fill="#666">R_pu(int)</text>
  <text x="772" y="304" class="lbl-sm" fill="#666">50&#8211;80k&#8486;</text>
  <text x="772" y="232" class="lbl-sm" fill="#666">3V3 (internal)</text>
  <text x="705" y="360" class="lbl-sm" fill="#666">Pin.PULL_UP enabled in software (GP3, GP4 only)</text>

  <!-- Internal pull-up on GP4 (dashed, inside Pico) -->
  <line x1="700" y1="420" x2="850" y2="420" class="dash"/>
  <line x1="850" y1="420" x2="850" y2="390" class="dash"/>
  <rect x="842" y="340" width="16" height="50" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="850" y1="340" x2="850" y2="235" class="dash"/>
  <line x1="850" y1="235" x2="760" y2="235" class="dash"/>
  <text x="862" y="370" class="lbl-sm" fill="#666">R_pu(int)</text>
  <text x="862" y="384" class="lbl-sm" fill="#666">50&#8211;80k&#8486;</text>

  <!-- ======================= 3V3 RAIL ======================= -->
  <line x1="700" y1="180" x2="120" y2="180" class="wire"/>
  <text x="70" y="184" class="lbl-b">3V3</text>

  <!-- ======================= GND RAIL ======================= -->
  <line x1="120" y1="880" x2="1160" y2="880" class="wire" stroke-width="3"/>
  <!-- GND symbol -->
  <line x1="620" y1="880" x2="620" y2="902" class="wire"/>
  <line x1="604" y1="902" x2="636" y2="902" class="wire"/>
  <line x1="610" y1="910" x2="630" y2="910" class="wire"/>
  <line x1="616" y1="918" x2="624" y2="918" class="wire"/>
  <text x="645" y="906" class="lbl-sm">GND</text>
  <!-- Pico GND pin to rail -->
  <line x1="700" y1="700" x2="670" y2="700" class="wire"/>
  <line x1="670" y1="700" x2="670" y2="880" class="wire"/>

  <!-- ======================= WHITE / SHUNT CHANNEL ======================= -->
  <!-- External pull-up R3 from 3V3 rail down to node N1 -->
  <line x1="180" y1="180" x2="180" y2="205" class="wire"/>
  <rect x="172" y="205" width="16" height="50" class="res"/>
  <text x="196" y="225" class="lbl">R3</text>
  <text x="196" y="241" class="lbl">2.2k&#8486;</text>
  <line x1="180" y1="255" x2="180" y2="290" class="wire"/>
  <!-- Node N1 -->
  <circle cx="180" cy="290" r="4" class="node"/>
  <text x="150" y="284" class="lbl-b">N1</text>
  <!-- N1 to GP2 -->
  <line x1="180" y1="290" x2="640" y2="290" class="wire"/>
  <line x1="640" y1="290" x2="640" y2="260" class="wire"/>
  <line x1="640" y1="260" x2="700" y2="260" class="wire"/>
  <!-- Dial assembly bracket (white pair) -->
  <rect x="110" y="330" width="230" height="230" fill="none" stroke="#8a6d3b" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="118" y="348" class="lbl-sm" fill="#8a6d3b">inside dial &#8212; WHITE pair</text>
  <!-- S1 switch: N1 down to GND -->
  <line x1="180" y1="290" x2="180" y2="380" class="wire"/>
  <circle cx="180" cy="380" r="3" class="node"/>
  <line x1="180" y1="380" x2="208" y2="440" class="wire"/>
  <circle cx="180" cy="450" r="3" class="node"/>
  <line x1="180" y1="450" x2="180" y2="880" class="wire"/>
  <text x="120" y="420" class="lbl-b">S1</text>
  <text x="120" y="436" class="lbl-sm">shunt /</text>
  <text x="120" y="450" class="lbl-sm">off-normal</text>
  <text x="120" y="464" class="lbl-sm">(N.O. at rest)</text>
  <!-- R_int 14.5k in parallel with S1 -->
  <line x1="290" y1="290" x2="290" y2="360" class="wire"/>
  <line x1="180" y1="290" x2="290" y2="290" class="wire"/>
  <rect x="282" y="360" width="16" height="50" class="res"/>
  <text x="304" y="380" class="lbl">R_int</text>
  <text x="304" y="396" class="lbl">14.5k&#8486;</text>
  <line x1="290" y1="410" x2="290" y2="540" class="wire"/>
  <line x1="290" y1="540" x2="180" y2="540" class="wire"/>
  <circle cx="180" cy="540" r="4" class="node"/>
  <circle cx="180" cy="290" r="4" class="node"/>
  <text x="304" y="430" class="lbl-sm">(measured: bleeder /</text>
  <text x="304" y="444" class="lbl-sm">spark-quench resistor</text>
  <text x="304" y="458" class="lbl-sm">across contacts)</text>

  <!-- ======================= BLUE / PULSE CHANNEL ======================= -->
  <!-- GP3 to node N2 -->
  <line x1="700" y1="340" x2="470" y2="340" class="wire"/>
  <circle cx="470" cy="340" r="4" class="node"/>
  <text x="480" y="334" class="lbl-b">N2</text>
  <!-- Dial assembly bracket (blue pair) -->
  <rect x="410" y="360" width="180" height="200" fill="none" stroke="#31708f" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="418" y="378" class="lbl-sm" fill="#31708f">inside dial &#8212; BLUE pair</text>
  <!-- S2 switch: N2 down to GND (N.C. -> drawn touching) -->
  <line x1="470" y1="340" x2="470" y2="410" class="wire"/>
  <circle cx="470" cy="410" r="3" class="node"/>
  <line x1="470" y1="410" x2="486" y2="478" class="wire"/>
  <circle cx="470" cy="480" r="3" class="node"/>
  <line x1="470" y1="480" x2="470" y2="880" class="wire"/>
  <text x="500" y="440" class="lbl-b">S2</text>
  <text x="500" y="456" class="lbl-sm">pulse contact</text>
  <text x="500" y="470" class="lbl-sm">(N.C. at rest;</text>
  <text x="500" y="484" class="lbl-sm">opens ~10Hz on</text>
  <text x="500" y="498" class="lbl-sm">spring return)</text>

  <!-- ======================= GREEN/WHITE / SWITCHHOOK CHANNEL ======================= -->
  <!-- GP4 to node N3 -->
  <line x1="700" y1="420" x2="300" y2="420" class="wire"/>
  <line x1="300" y1="420" x2="300" y2="620" class="wire"/>
  <circle cx="300" cy="620" r="4" class="node"/>
  <text x="310" y="614" class="lbl-b">N3</text>
  <!-- Lever assembly bracket -->
  <rect x="150" y="640" width="300" height="200" fill="none" stroke="#3a8a3a" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="158" y="658" class="lbl-sm" fill="#3a8a3a">under the handset cradle &#8212; GREEN/WHITE pair</text>
  <!-- S3 switch: N3 down to GND (true dry contact, N.O., closes when lever is PRESSED / on-hook) -->
  <line x1="300" y1="620" x2="300" y2="700" class="wire"/>
  <circle cx="300" cy="700" r="3" class="node"/>
  <line x1="300" y1="700" x2="326" y2="758" class="wire"/>
  <circle cx="300" cy="770" r="3" class="node"/>
  <line x1="300" y1="770" x2="300" y2="880" class="wire"/>
  <text x="330" y="730" class="lbl-b">S3</text>
  <text x="330" y="746" class="lbl-sm">switchhook lever</text>
  <text x="330" y="760" class="lbl-sm">true dry contact:</text>
  <text x="330" y="774" class="lbl-sm">pressed (on-hook,</text>
  <text x="330" y="788" class="lbl-sm">handset resting) =</text>
  <text x="330" y="802" class="lbl-sm">CLOSED (&#8776;0&#8486;)</text>
  <text x="330" y="816" class="lbl-sm">released (off-hook,</text>
  <text x="330" y="830" class="lbl-sm">lifted) = OPEN</text>

  <!-- ======================= LED CHANNELS (right) ======================= -->
  <!-- GP14 -->
  <line x1="940" y1="430" x2="985" y2="430" class="wire"/>
  <rect x="985" y="422" width="50" height="16" class="res"/>
  <text x="988" y="416" class="lbl-sm">R1 330&#8486;</text>
  <line x1="1035" y1="430" x2="1070" y2="430" class="wire"/>
  <polygon points="1070,420 1070,440 1098,430" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="1098" y1="420" x2="1098" y2="440" class="wire"/>
  <line x1="1080" y1="412" x2="1088" y2="402" class="wire"/>
  <line x1="1088" y1="402" x2="1092" y2="407" class="wire"/>
  <line x1="1071" y1="410" x2="1079" y2="400" class="wire"/>
  <line x1="1079" y1="400" x2="1083" y2="405" class="wire"/>
  <text x="1058" y="458" class="lbl-sm">LED1 &#8220;SHUNT&#8221;</text>
  <line x1="1098" y1="430" x2="1130" y2="430" class="wire"/>
  <line x1="1130" y1="430" x2="1130" y2="880" class="wire"/>
  <!-- GP15 -->
  <line x1="940" y1="500" x2="985" y2="500" class="wire"/>
  <rect x="985" y="492" width="50" height="16" class="res"/>
  <text x="988" y="486" class="lbl-sm">R2 330&#8486;</text>
  <line x1="1035" y1="500" x2="1070" y2="500" class="wire"/>
  <polygon points="1070,490 1070,510 1098,500" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="1098" y1="490" x2="1098" y2="510" class="wire"/>
  <line x1="1080" y1="482" x2="1088" y2="472" class="wire"/>
  <line x1="1088" y1="472" x2="1092" y2="477" class="wire"/>
  <line x1="1071" y1="480" x2="1079" y2="470" class="wire"/>
  <line x1="1079" y1="470" x2="1083" y2="475" class="wire"/>
  <text x="1058" y="528" class="lbl-sm">LED2 &#8220;PULSE&#8221;</text>
  <line x1="1098" y1="500" x2="1160" y2="500" class="wire"/>
  <line x1="1160" y1="500" x2="1160" y2="880" class="wire"/>
  <text x="945" y="560" class="lbl-sm" fill="#666">No LED on GP4 (HOOK) --</text>
  <text x="945" y="576" class="lbl-sm" fill="#666">not needed to troubleshoot</text>
  <text x="945" y="592" class="lbl-sm" fill="#666">so far; add one like</text>
  <text x="945" y="608" class="lbl-sm" fill="#666">LED1/LED2 if needed.</text>

  <!-- ======================= ANALYSIS BOX ======================= -->
  <rect x="20" y="928" width="1200" height="100" fill="#eef4ff" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="32" y="948" class="lbl-b" fill="#1c3f66">Switchhook (S3) behavior and firmware mapping</text>
  <text x="32" y="966" class="lbl-sm" fill="#1c3f66">S3 is a true dry contact (DMM confirmed: &#8776;0&#8486; pressed, open/out-of-range released), same as BLUE. Internal Pin.PULL_UP on GP4 is sufficient; no external resistor needed.</text>
  <text x="32" y="984" class="lbl-sm" fill="#1c3f66">Lever PRESSED (handset resting) = on-hook = GP4 LOW (closed to GND) = MUTE (main.py sends a 0% volume HID report, remembering the last dialed target).</text>
  <text x="32" y="1002" class="lbl-sm" fill="#1c3f66">Lever RELEASED (handset lifted) = off-hook = GP4 HIGH (pulled to 3V3) = firmware restores the last dialed volume target automatically.</text>
  <text x="32" y="1020" class="lbl-sm" fill="#1c3f66">Debounce: 30ms (heavier lever spring than the dial contacts, which use 15ms). Polarity within the GREEN/WHITE pair does not matter.</text>
</svg>
